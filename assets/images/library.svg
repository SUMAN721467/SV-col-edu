<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="libBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="woodShelf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="50%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#libBg)"/>

  <!-- Bookshelves in Background -->
  <!-- Shelf Left -->
  <rect x="50" y="80" width="300" height="480" fill="url(#woodShelf)" rx="6"/>
  <!-- Shelf Lines & Books -->
  <rect x="70" y="140" width="260" height="15" fill="#451A03"/>
  <rect x="70" y="240" width="260" height="15" fill="#451A03"/>
  <rect x="70" y="340" width="260" height="15" fill="#451A03"/>
  <rect x="70" y="440" width="260" height="15" fill="#451A03"/>

  <!-- Book Spines Pattern -->
  <g fill="#D97706">
    <rect x="80" y="95" width="18" height="45" fill="#EF4444"/>
    <rect x="100" y="90" width="22" height="50" fill="#3B82F6"/>
    <rect x="124" y="98" width="16" height="42" fill="#10B981"/>
    <rect x="142" y="90" width="25" height="50" fill="#F59E0B"/>
    <rect x="170" y="95" width="20" height="45" fill="#8B5CF6"/>
    <rect x="192" y="92" width="18" height="48" fill="#EC4899"/>
    <rect x="212" y="90" width="24" height="50" fill="#06B6D4"/>
    <rect x="238" y="96" width="20" height="44" fill="#EAB308"/>
    <rect x="260" y="90" width="22" height="50" fill="#6366F1"/>
    <rect x="284" y="94" width="18" height="46" fill="#14B8A6"/>
  </g>

  <!-- Shelf Right -->
  <rect x="850" y="80" width="300" height="480" fill="url(#woodShelf)" rx="6"/>
  <rect x="870" y="140" width="260" height="15" fill="#451A03"/>
  <rect x="870" y="240" width="260" height="15" fill="#451A03"/>
  <rect x="870" y="340" width="260" height="15" fill="#451A03"/>
  <rect x="870" y="440" width="260" height="15" fill="#451A03"/>

  <!-- Study Desks in Center -->
  <rect x="380" y="320" width="440" height="200" fill="#B45309" rx="8"/>
  <rect x="400" y="300" width="400" height="25" fill="#78350F" rx="4"/>

  <!-- Warm Library Reading Lamps -->
  <circle cx="480" cy="270" r="14" fill="#FDE047"/>
  <polygon points="480,270 410,480 550,480" fill="url(#warmLight)"/>

  <circle cx="720" cy="270" r="14" fill="#FDE047"/>
  <polygon points="720,270 650,480 790,480" fill="url(#warmLight)"/>

  <!-- Laptops & Open Books -->
  <rect x="450" y="350" width="60" height="35" fill="#CBD5E1" rx="2"/>
  <rect x="690" y="350" width="60" height="35" fill="#CBD5E1" rx="2"/>

  <!-- Title Badge -->
  <rect x="400" y="40" width="400" height="60" rx="8" fill="#0A1E3F" stroke="#D9822B" stroke-width="2"/>
  <text x="600" y="76" fill="#F5AB48" font-family="Arial, sans-serif" font-weight="bold" font-size="18" text-anchor="middle">SVCE CENTRAL LIBRARY & RESOURCE HALL</text>
</svg>
