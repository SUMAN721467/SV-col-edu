<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="classBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#classBg)"/>

  <!-- Classroom Floor -->
  <polygon points="0,520 1200,520 1200,675 0,675" fill="#CBD5E1"/>

  <!-- Smart Digital Interactive Board -->
  <rect x="250" y="60" width="700" height="340" fill="url(#boardGrad)" rx="12" stroke="#64748B" stroke-width="8"/>
  <rect x="280" y="90" width="640" height="280" fill="#0A1E3F" rx="6"/>

  <!-- Smart Board Content -->
  <text x="600" y="140" fill="#F5AB48" font-family="Arial, sans-serif" font-weight="bold" font-size="24" text-anchor="middle">PEDAGOGICAL EXCELLENCE & INTERACTIVE TEACHING</text>
  <line x1="340" y1="160" x2="860" y2="160" stroke="#3B82F6" stroke-width="2"/>
  
  <text x="360" y="210" fill="#93C5FD" font-family="Arial, sans-serif" font-size="16">✓ Micro-Teaching & Lesson Plan Mastery</text>
  <text x="360" y="250" fill="#93C5FD" font-family="Arial, sans-serif" font-size="16">✓ Diagnostic & Remedial Assessment Strategies</text>
  <text x="360" y="290" fill="#93C5FD" font-family="Arial, sans-serif" font-size="16">✓ ICT Integration in Secondary & Elementary Classrooms</text>
  <text x="360" y="330" fill="#93C5FD" font-family="Arial, sans-serif" font-size="16">✓ Inclusive Education & Child Psychology Methodologies</text>

  <!-- Teacher Podium / Desk -->
  <rect x="120" y="360" width="100" height="180" fill="#78350F" rx="4"/>
  <polygon points="110,360 230,360 220,380 120,380" fill="#9A3412"/>

  <!-- Student Desks Matrix -->
  <!-- Row 1 -->
  <rect x="300" y="460" width="160" height="70" fill="#94A3B8" rx="4"/>
  <rect x="520" y="460" width="160" height="70" fill="#94A3B8" rx="4"/>
  <rect x="740" y="460" width="160" height="70" fill="#94A3B8" rx="4"/>

  <!-- Chairs -->
  <circle cx="380" cy="560" r="22" fill="#0A1E3F"/>
  <circle cx="600" cy="560" r="22" fill="#0A1E3F"/>
  <circle cx="820" cy="560" r="22" fill="#0A1E3F"/>
</svg>
